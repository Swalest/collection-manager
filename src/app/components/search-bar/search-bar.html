<div class="search-box">
    <img src="img/search.jpg" alt=" Search bar">
    <!--
    One-way binding
    [ngModel]="search()"
    (ngModelChange)="updateSearch($event)"
    -->

    <!--two-way binding-->
    <input 
        id="live-search"
        type="search"
        placeholder="Search ..."
        autocapitalize="off"
        [(ngModel)]="search"
    >
    <button (click)="searchClicked()">Search</button>
</div>
