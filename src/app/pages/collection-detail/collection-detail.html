<p>collection-detail works!</p>
<header id="collection-header">
  <h1>My Collection</h1>
  <div>
    <!--two-way binding-->
    <app-search-bar
          [(search)]="search"
    >
    </app-search-bar>
  </div>
</header>
<section class="collection-item-card-container">
  @for(item of collectionItems(); track item.name){
    <app-collection-item-card [item]="item"></app-collection-item-card>
  }
</section>
@let itemsCount = collectionItems()?.length;
@if(itemsCount){
  <div class="centered">Found {{itemsCount}} results</div>
} @else {
  <div class="centered">No items found .</div>
}

<div class="centered">
  <button (click)="addGenericItem()">Add Generic Item</button>
</div>
